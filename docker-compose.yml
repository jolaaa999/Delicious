services:
  mysql:
    image: mysql:8.0
    container_name: delicious-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: delicious
      MYSQL_USER: delicious
      MYSQL_PASSWORD: delicious
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udelicious", "-pdelicious"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delicious-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MYSQL_DSN: "delicious:delicious@tcp(mysql:3306)/delicious?charset=utf8mb4&parseTime=True&loc=Local"
      AUTO_MIGRATE: "true"
      UPLOAD_DIR: "/app/uploads"
      PUBLIC_BASE_URL: "http://localhost:8080"
      MAX_UPLOAD_MB: "10"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  upload_data:
