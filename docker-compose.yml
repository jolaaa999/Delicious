services:
  postgres:
    image: postgres:16-alpine
    container_name: delicious-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delicious
      POSTGRES_PASSWORD: delicious
      POSTGRES_DB: delicious
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docs/database/schema.pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delicious -d delicious"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delicious-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://delicious:delicious@postgres:5432/delicious?sslmode=disable"
      AUTO_MIGRATE: "true"
      UPLOAD_DIR: "/app/uploads"
      PUBLIC_BASE_URL: "http://localhost:8080"
      MAX_UPLOAD_MB: "10"
      DEFAULT_USER_ID: "1"
      ENCYCLOPEDIA_ONLINE_SEARCH: "true"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  upload_data:
